# Mengaktifkan daemon Gradle agar proses build lebih cepat
org.gradle.daemon=true

# Menambah alokasi memori untuk Gradle supaya tidak gampang "Out of Memory"
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Mengaktifkan fitur parallel untuk mempercepat proses kompilasi
org.gradle.parallel=true